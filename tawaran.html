<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — JOBnesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
<style>
  .dash-wrap{ padding: 56px 0 90px; }
  .dash-head{ display:flex; justify-content:space-between; align-items:flex-end; margin-bottom:32px; flex-wrap:wrap; gap:16px; }
  .dash-head .eyebrow{
    display:block; font-family:'IBM Plex Mono', monospace; font-size:0.78rem;
    letter-spacing:0.06em; text-transform:uppercase; color:var(--teal); margin-bottom:10px;
  }
  .dash-head h1{ font-size: clamp(1.6rem, 3vw, 2.2rem); margin-bottom: 6px; }
  .dash-head p{ color: var(--ink-soft); }

  .dash-stats{ display:grid; grid-template-columns: repeat(4, 1fr); gap:14px; margin-bottom:36px; }
  .dash-stat-card{
    padding:20px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--paper-raised); text-align:center;
  }
  .dash-stat-card .num{ font-family:'Plus Jakarta Sans',sans-serif; font-weight:800; font-size:1.8rem; color:var(--teal-deep); }
  .dash-stat-card .lbl{ font-size:0.78rem; color:var(--ink-soft); margin-top:4px; }

  .dash-tabs{ display:flex; gap:8px; margin-bottom:24px; border-bottom:1px solid var(--line); }
  .dash-tab{
    padding:10px 4px; margin-right:20px; font-size:0.9rem; font-weight:600; color:var(--ink-soft);
    border-bottom:2px solid transparent; cursor:pointer; background:none; border-top:none; border-left:none; border-right:none;
    font-family:'Inter',sans-serif;
  }
  .dash-tab.active{ color:var(--teal-deep); border-bottom-color:var(--teal); }

  .riwayat-list{ display:flex; flex-direction:column; gap:14px; }
  .riwayat-card{
    display:flex; justify-content:space-between; align-items:center; gap:16px;
    padding:18px 22px; border-radius:var(--radius); border:1px solid var(--line);
    background:var(--paper-raised); flex-wrap:wrap;
  }
  .riwayat-main h4{ font-family:'Plus Jakarta Sans',sans-serif; font-size:0.98rem; margin-bottom:4px; }
  .riwayat-meta{ font-size:0.8rem; color:var(--ink-soft); display:flex; gap:12px; flex-wrap:wrap; }
  .riwayat-side{ text-align:right; }
  .riwayat-budget{ font-family:'IBM Plex Mono',monospace; font-weight:600; color:var(--teal-deep); margin-bottom:6px; }

  .badge-status{ display:inline-block; padding:4px 10px; border-radius:999px; font-size:0.72rem; font-weight:600; margin-left:6px; }
  .badge-menunggu, .badge-open, .badge-pending{ background:rgba(242,169,59,0.18); color:#93630E; }
  .badge-diterima, .badge-in_progress, .badge-accepted{ background:rgba(14,110,92,0.12); color:var(--teal-deep); }
  .badge-dikerjakan{ background:rgba(14,110,92,0.12); color:var(--teal-deep); }
  .badge-selesai, .badge-completed{ background:rgba(74,84,77,0.12); color:var(--ink-soft); }
  .badge-rejected, .badge-cancelled{ background:rgba(225,68,42,0.12); color:var(--chili); }

  .applicant-list{ margin-top:14px; padding-top:14px; border-top:1px dashed var(--line); width:100%; display:flex; flex-direction:column; gap:10px; }
  .applicant-row{ display:flex; justify-content:space-between; align-items:center; gap:12px; padding:10px 12px; border-radius:10px; background:var(--paper); flex-wrap:wrap; }
  .applicant-row .pitch{ font-size:0.82rem; color:var(--ink-soft); max-width:360px; }
  .applicant-actions{ display:flex; gap:6px; }

  .empty-state{
    text-align:center; padding:60px 20px; color:var(--ink-soft);
    border:1.5px dashed var(--line); border-radius:var(--radius);
  }

  select.status-select{
    padding:6px 10px; border-radius:8px; border:1.5px solid var(--line);
    background:var(--paper); font-family:'Inter',sans-serif; font-size:0.8rem;
  }

  @media (max-width:760px){
    .dash-stats{ grid-template-columns: repeat(2, 1fr); }
    .riwayat-card{ flex-direction:column; align-items:flex-start; }
    .riwayat-side{ text-align:left; width:100%; }
  }
</style>
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="dash-wrap">
    <div class="wrap">

      <div class="dash-head">
        <div>
          <span class="eyebrow" id="dashEyebrow">Dashboard</span>
          <h1 id="dashTitle">Ringkasan Aktivitas</h1>
          <p id="dashSubtitle">Pantau kebutuhan dan status pekerjaanmu di sini.</p>
        </div>
        <a id="dashCta" href="posting.html" class="btn btn-primary">Posting Kebutuhan Baru</a>
      </div>

      <div class="dash-stats" id="dashStats">
        <!-- diisi lewat JS -->
      </div>

      <div class="dash-tabs" id="dashTabs">
        <!-- diisi lewat JS, sesuai role -->
      </div>

      <div class="riwayat-list" id="riwayatList"></div>
      <div class="empty-state" id="emptyState" style="display:none;">
        Belum ada riwayat di sini.
      </div>

    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="components.js"></script>
<script src="script.js"></script>
<script>
  const API_BASE = 'http://localhost:8080/api/v1';

  async function apiFetch(path, options){
    options = options || {};
    const res = await fetch(API_BASE + path, {
      method: options.method || 'GET',
      headers: Object.assign({ 'Content-Type': 'application/json' }, options.headers || {}),
      body: options.body
    });
    const body = await res.json().catch(function(){ return {}; });
    if(!res.ok){
      throw new Error(body.message || 'Terjadi kesalahan, coba lagi.');
    }
    return body.data;
  }

  // ---------- Guard: harus login ----------
  const session = JSON.parse(localStorage.getItem('jobnesia_session') || 'null');
  const token = localStorage.getItem('jobnesia_token');
  if(!session || !token){
    window.location.href = 'login.html';
  }

  const isUmkm = session.role === 'umkm';
  let activeFilter = 'semua';
  let categoryLabels = {};
  let myJobs = [];          // UMKM: job yang dia posting
  let myApplications = [];  // Freelancer: lamaran dia + detail job-nya

  function formatRupiah(angka){
    return 'Rp' + Number(angka).toLocaleString('id-ID');
  }

  function waktuRelatif(iso){
    const diffMs = Date.now() - new Date(iso).getTime();
    const menit = Math.floor(diffMs / 60000);
    if(menit < 1) return 'Baru saja';
    if(menit < 60) return menit + ' menit lalu';
    const jam = Math.floor(menit / 60);
    if(jam < 24) return jam + ' jam lalu';
    return Math.floor(jam / 24) + ' hari lalu';
  }

  const STATUS_LABEL = {
    open: 'Terbuka', in_progress: 'Berjalan', completed: 'Selesai', cancelled: 'Dibatalkan',
    pending: 'Menunggu Respon', accepted: 'Diterima', rejected: 'Tidak Terpilih', withdrawn: 'Dibatalkan'
  };
  function badgeHtml(status){
    return '<span class="badge-status badge-' + status + '">' + (STATUS_LABEL[status] || status) + '</span>';
  }

  // ---------- Setup header & tab sesuai role ----------
  const dashTabs = document.getElementById('dashTabs');
  if(isUmkm){
    document.getElementById('dashEyebrow').textContent = 'Dashboard UMKM';
    document.getElementById('dashTitle').textContent = 'Riwayat Kebutuhan Kamu';
    document.getElementById('dashSubtitle').textContent = 'Semua kebutuhan yang pernah kamu posting beserta statusnya.';
    dashTabs.innerHTML =
      '<button class="dash-tab active" data-filter="semua">Semua</button>' +
      '<button class="dash-tab" data-filter="open">Terbuka</button>' +
      '<button class="dash-tab" data-filter="in_progress">Berjalan</button>' +
      '<button class="dash-tab" data-filter="completed">Selesai</button>';
  } else {
    document.getElementById('dashEyebrow').textContent = 'Dashboard Freelancer';
    document.getElementById('dashTitle').textContent = 'Riwayat Lamaran Kamu';
    document.getElementById('dashSubtitle').textContent = 'Semua tawaran kerja yang pernah kamu lamar beserta statusnya.';
    document.getElementById('dashCta').textContent = 'Cari Tawaran Kerja';
    document.getElementById('dashCta').href = 'tawaran.html';
    dashTabs.innerHTML =
      '<button class="dash-tab active" data-filter="semua">Semua</button>' +
      '<button class="dash-tab" data-filter="pending">Menunggu Respon</button>' +
      '<button class="dash-tab" data-filter="accepted">Diterima</button>' +
      '<button class="dash-tab" data-filter="rejected">Tidak Terpilih</button>';
  }
  document.querySelectorAll('.dash-tab').forEach(function(tab){
    tab.addEventListener('click', function(){
      document.querySelectorAll('.dash-tab').forEach(function(t){ t.classList.remove('active'); });
      tab.classList.add('active');
      activeFilter = tab.getAttribute('data-filter');
      isUmkm ? renderUmkm() : renderFreelancer();
    });
  });

  // ================= UMKM =================

  function renderStats(total, waiting, active, done, labelTotal, labelWaiting){
    document.getElementById('dashStats').innerHTML =
      '<div class="dash-stat-card"><div class="num">' + total + '</div><div class="lbl">' + labelTotal + '</div></div>' +
      '<div class="dash-stat-card"><div class="num">' + waiting + '</div><div class="lbl">' + labelWaiting + '</div></div>' +
      '<div class="dash-stat-card"><div class="num">' + active + '</div><div class="lbl">Sedang Berjalan</div></div>' +
      '<div class="dash-stat-card"><div class="num">' + done + '</div><div class="lbl">Selesai</div></div>';
  }

  function renderUmkm(){
    const total = myJobs.length;
    const open = myJobs.filter(function(j){ return j.status === 'open'; }).length;
    const active = myJobs.filter(function(j){ return j.status === 'in_progress'; }).length;
    const done = myJobs.filter(function(j){ return j.status === 'completed'; }).length;
    renderStats(total, open, active, done, 'Total Diposting', 'Masih Terbuka');

    let filtered = myJobs;
    if(activeFilter !== 'semua'){
      filtered = myJobs.filter(function(j){ return j.status === activeFilter; });
    }
    filtered.sort(function(a,b){ return new Date(b.created_at) - new Date(a.created_at); });

    const riwayatList = document.getElementById('riwayatList');
    const emptyState = document.getElementById('emptyState');
    if(filtered.length === 0){
      riwayatList.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    riwayatList.innerHTML = filtered.map(function(job){
      const statusControl = job.status === 'open'
        ? '<button class="btn btn-ghost btn-sm" onclick="toggleApplicants(' + job.id + ')">Lihat Pelamar</button>'
        : '<select class="status-select" onchange="updateJobStatus(' + job.id + ', this.value)">' +
            '<option value="in_progress"' + (job.status==='in_progress'?' selected':'') + '>Berjalan</option>' +
            '<option value="completed"' + (job.status==='completed'?' selected':'') + '>Selesai</option>' +
          '</select>';

      return (
        '<div class="riwayat-card" id="job-card-' + job.id + '">' +
          '<div class="riwayat-main">' +
            '<h4>' + job.title + badgeHtml(job.status) + '</h4>' +
            '<div class="riwayat-meta">' +
              '<span>📍 ' + (job.location || '-') + '</span>' +
              '<span>' + (categoryLabels[job.category_id] || 'Lainnya') + '</span>' +
              '<span>🕒 ' + waktuRelatif(job.created_at) + '</span>' +
            '</div>' +
            '<div class="applicant-list" id="applicants-' + job.id + '" style="display:none;"></div>' +
          '</div>' +
          '<div class="riwayat-side">' +
            '<div class="riwayat-budget">' + formatRupiah(job.budget_amount) + '</div>' +
            statusControl +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  // Buka/tutup panel pelamar untuk 1 job, muat dari backend sekali saat dibuka
  async function toggleApplicants(jobId){
    const panel = document.getElementById('applicants-' + jobId);
    if(panel.style.display === 'block'){
      panel.style.display = 'none';
      return;
    }
    panel.style.display = 'block';
    panel.innerHTML = 'Memuat pelamar...';

    try {
      const apps = await apiFetch('/applications/job/' + jobId, { headers: { 'Authorization': 'Bearer ' + token } });
      if(apps.length === 0){
        panel.innerHTML = '<span style="font-size:0.85rem; color:var(--ink-soft);">Belum ada yang melamar.</span>';
        return;
      }
      panel.innerHTML = apps.map(function(app){
        if(app.status === 'pending'){
          return '<div class="applicant-row">' +
            '<div><b>Freelancer #' + app.freelancer_id + '</b> ' + badgeHtml(app.status) +
              '<div class="pitch">' + app.pitch_message + '</div></div>' +
            '<div class="applicant-actions">' +
              '<button class="btn btn-primary btn-sm" onclick="respondApplicant(' + app.id + ', ' + jobId + ', \'accepted\')">Terima</button>' +
              '<button class="btn btn-ghost btn-sm" onclick="respondApplicant(' + app.id + ', ' + jobId + ', \'rejected\')">Tolak</button>' +
            '</div>' +
          '</div>';
        }
        return '<div class="applicant-row">' +
          '<div><b>Freelancer #' + app.freelancer_id + '</b> ' + badgeHtml(app.status) +
            '<div class="pitch">' + app.pitch_message + '</div></div>' +
        '</div>';
      }).join('');
    } catch(err){
      panel.innerHTML = '<span style="font-size:0.85rem; color:var(--chili);">Gagal memuat: ' + err.message + '</span>';
    }
  }

  // Terima/tolak pelamar. Kalau diterima, job otomatis dipindah ke status "Berjalan".
  async function respondApplicant(appId, jobId, newStatus){
    try {
      await apiFetch('/applications/' + appId + '/status', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ status: newStatus })
      });
      if(newStatus === 'accepted'){
        await apiFetch('/jobs/' + jobId + '/status', {
          method: 'PATCH',
          headers: { 'Authorization': 'Bearer ' + token },
          body: JSON.stringify({ status: 'in_progress' })
        });
      }
      await loadData();
    } catch(err){
      alert('Gagal memproses: ' + err.message);
    }
  }

  // Dipanggil dari dropdown status (UMKM, job yang sudah berjalan)
  async function updateJobStatus(jobId, newStatus){
    try {
      await apiFetch('/jobs/' + jobId + '/status', {
        method: 'PATCH',
        headers: { 'Authorization': 'Bearer ' + token },
        body: JSON.stringify({ status: newStatus })
      });
      await loadData();
    } catch(err){
      alert('Gagal mengubah status: ' + err.message);
    }
  }

  // ================= FREELANCER =================

  function renderFreelancer(){
    const total = myApplications.length;
    const pending = myApplications.filter(function(a){ return a.status === 'pending'; }).length;
    const accepted = myApplications.filter(function(a){ return a.status === 'accepted'; }).length;
    const rejected = myApplications.filter(function(a){ return a.status === 'rejected'; }).length;
    renderStats(total, pending, accepted, rejected, 'Total Dilamar', 'Menunggu Respon');

    let filtered = myApplications;
    if(activeFilter !== 'semua'){
      filtered = myApplications.filter(function(a){ return a.status === activeFilter; });
    }
    filtered.sort(function(a,b){ return new Date(b.applied_at) - new Date(a.applied_at); });

    const riwayatList = document.getElementById('riwayatList');
    const emptyState = document.getElementById('emptyState');
    if(filtered.length === 0){
      riwayatList.innerHTML = '';
      emptyState.style.display = 'block';
      return;
    }
    emptyState.style.display = 'none';

    riwayatList.innerHTML = filtered.map(function(app){
      const job = app.job;
      return (
        '<div class="riwayat-card">' +
          '<div class="riwayat-main">' +
            '<h4>' + job.title + badgeHtml(app.status) + '</h4>' +
            '<div class="riwayat-meta">' +
              '<span>📍 ' + (job.location || '-') + '</span>' +
              '<span>Status kebutuhan: ' + STATUS_LABEL[job.status] + '</span>' +
              '<span>🕒 ' + waktuRelatif(app.applied_at) + '</span>' +
            '</div>' +
          '</div>' +
          '<div class="riwayat-side">' +
            '<div class="riwayat-budget">' + formatRupiah(job.budget_amount) + '</div>' +
          '</div>' +
        '</div>'
      );
    }).join('');
  }

  // ================= MUAT DATA =================

  async function loadData(){
    const categories = await apiFetch('/categories');
    categories.forEach(function(cat){ categoryLabels[cat.id] = cat.name; });

    const allJobs = await apiFetch('/jobs');

    if(isUmkm){
      myJobs = allJobs.filter(function(j){ return j.umkm_id === session.profileId; });
      renderUmkm();
    } else {
      const apps = await apiFetch('/applications/freelancer/' + session.profileId, {
        headers: { 'Authorization': 'Bearer ' + token }
      });
      const jobById = {};
      allJobs.forEach(function(j){ jobById[j.id] = j; });
      myApplications = apps
        .map(function(a){ return Object.assign({}, a, { job: jobById[a.job_id] }); })
        .filter(function(a){ return a.job; }); // buang kalau job-nya somehow sudah tidak ada
      renderFreelancer();
    }
  }

  loadData();
</script>

</body>
</html>
