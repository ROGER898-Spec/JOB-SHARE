<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Masuk — JOBnesia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css">
</head>
<body>

<header id="site-header"></header>

<main>
  <section class="auth-section">
    <div class="wrap">
      <div class="auth-card">
        <div class="auth-head">
          <span class="eyebrow">Masuk</span>
          <h1>Selamat datang kembali</h1>
          <p>Masuk untuk lanjut posting kebutuhan atau cari kerja lepas terdekat.</p>
        </div>

        <form id="loginForm">
          <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" required>
          </div>

          <div class="form-group">
            <label for="password">Kata Sandi</label>
            <input type="password" id="password" required>
          </div>

          <div class="form-error" id="formError">Email atau kata sandi salah. Coba lagi.</div>

          <button type="submit" class="btn btn-primary auth-submit">Masuk</button>
          <div class="auth-msg" id="loginMsg"></div>
        </form>

        <div class="auth-switch">Belum punya akun? <a href="register.html">Daftar di sini</a></div>
      </div>
    </div>
  </section>
</main>

<footer id="site-footer"></footer>

<script src="components.js"></script>
<script src="script.js"></script>
<script>
  // Login — simulasi cek ke localStorage (belum ada backend sungguhan)
  const loginForm = document.getElementById('loginForm');
  const formError = document.getElementById('formError');
  const loginMsg = document.getElementById('loginMsg');

  loginForm.addEventListener('submit', function(e){
    e.preventDefault();

    const email = document.getElementById('email').value;
    const password = document.getElementById('password').value;

    const users = JSON.parse(localStorage.getItem('jobnesia_users') || '[]');
    const match = users.find(function(u){ return u.email === email && u.password === password; });

    if(!match){
      formError.style.display = 'block';
      loginMsg.textContent = '';
      return;
    }
    formError.style.display = 'none';

    // Simpan siapa yang sedang login (simulasi sesi)
    localStorage.setItem('jobnesia_current_user', JSON.stringify(match));

    loginMsg.textContent = 'Berhasil masuk sebagai ' + match.nama + '! Mengarahkan...';
    loginMsg.className = 'auth-msg success';

    setTimeout(function(){
      // Diarahkan ke dashboard -- kontennya otomatis menyesuaikan role
      // (UMKM lihat riwayat kebutuhan, Freelancer lihat riwayat kerja)
      window.location.href = 'dashboard.html';
    }, 1200);
  });
</script>

</body>
</html>
